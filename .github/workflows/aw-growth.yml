name: idol-db AW growth loop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AW
        run: python aw/run.py

      - name: Validate JSONL
        run: python -m json.tool /dev/null >/dev/null 2>&1 || true

      - name: Commit growth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No JSONL growth"
          else
            git commit -m "chore(data): grow canonical JSONL"
            git push
          fi
