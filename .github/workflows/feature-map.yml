name: Generate idol feature map

on:
  push:
    paths:
      - data/idols.json
      - taxonomy/idol-features.yaml
      - aw/feature_mapper.py
      - rag/people/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feature map
        run: python aw/feature_mapper.py

      - name: Commit generated map
        run: |
          if git diff --quiet -- data/feature-map.json; then
            echo "feature-map unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feature-map.json
          git commit -m "chore: regenerate idol feature map [skip ci]"
          git push
