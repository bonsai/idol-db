name: idol-db AW crawler

on:
  workflow_dispatch:
    inputs:
      intent:
        description: "Search intent group (all keeps the full template)"
        required: false
        default: "all"
        type: string
  schedule:
    - cron: "07 */6 * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Crawl search intents
        env:
          CRAWL_TEMPLATE: aw/crawler-template.json
          CRAWL_OUTPUT: data/observations.jsonl
        run: go run ./scripts/crawler.go
      - name: Commit observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.jsonl
          if git diff --cached --quiet; then
            echo "No new observations"
          else
            git commit -m "chore(crawler): collect search observations"
            git push
          fi
