name: IDOL Watch RSS

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Crawl IDOL Watch
        run: python crawler/idolwatch.py

      - name: Generate RSS
        run: python crawler/generate_rss.py

      - name: Commit data and RSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/idolwatch.jsonl rss/idolwatch.xml
          git diff --cached --quiet || git commit -m 'Update IDOL Watch data and RSS'
          git push
